[tool.pytest.ini_options]
# Permite ejecutar `pytest` a secas (CI, README) además de `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Se soporta Python 3.10+, por eso se usa timezone.utc en lugar de datetime.UTC (3.11+).
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "C4", "PIE"]

[tool.ruff.lint.flake8-bugbear]
# Depends() y Query() en los argumentos son el idioma estándar de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
