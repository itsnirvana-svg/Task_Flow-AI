name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest .claude/hooks -q

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pglast
      - name: Validar sintaxis PostgreSQL de los scripts
        run: |
          python - <<'PY'
          import glob, pglast
          archivos = glob.glob("backend/db/**/*.sql", recursive=True)
          for ruta in archivos:
              pglast.parse_sql(open(ruta, encoding="utf-8").read())
              print("OK", ruta)
          assert archivos, "No se encontraron scripts SQL"
          PY
