name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint y pruebas (backend y hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests .claude tools
      - run: pytest -q  # backend/tests y .claude/hooks, según pyproject.toml

  postgres:
    name: Pruebas con PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas de backend/tests/test_postgres.py recrean el esquema `public` de esta base.
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q -rs backend/tests/test_postgres.py

  deploy:
    name: Despliegue (imagen y pila de contenedores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker compose y los scripts
        run: |
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
          for f in deploy/backup.sh deploy/restore.sh deploy/postgres/init/01-n8n.sh; do bash -n "$f"; done
      - name: Construir la imagen de la API
        run: docker build -t taskflow-api:ci backend
      - name: Levantar PostgreSQL y la API con una configuración de producción de prueba
        working-directory: deploy
        run: |
          set -euo pipefail
          secreto() { openssl rand -hex 24; }   # 48 caracteres, más que el mínimo de 32
          CLAVE="$(secreto)"
          cat > .env <<EOF
          DOMAIN=ci.example.com
          ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=$(secreto)
          N8N_DB_PASSWORD=$(secreto)
          CORS_ORIGINS=https://ci.example.com
          API_KEYS=pruebas:${CLAVE}
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD_HASH='scrypt\$16384\$8\$1\$c2FsdGVkc2FsdA==\$aGFzaGhhc2hoYXNoaGFzaGhhc2hoYXNoaGFzaA=='
          AUTH_SECRET_KEY=$(secreto)
          N8N_WEBHOOK_SECRET=$(secreto)
          N8N_ENCRYPTION_KEY=$(secreto)
          EOF

          esperar_api() {
            for _ in $(seq 1 60); do
              estado="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")"
              [ "$estado" = healthy ] && return 0
              sleep 2
            done
            return 1
          }
          codigo() {   # código HTTP de una petición hecha desde dentro del contenedor de la API
            docker compose exec -T api python -c "
          import sys, urllib.request, urllib.error
          cabeceras = dict(h.split('=', 1) for h in sys.argv[2:])
          peticion = urllib.request.Request('http://127.0.0.1:8000' + sys.argv[1], headers=cabeceras)
          try:
              print(urllib.request.urlopen(peticion, timeout=5).status)
          except urllib.error.HTTPError as error:
              print(error.code)
          " "$@"
          }
          psql_tf() { docker compose exec -T postgres psql -U taskflow -d taskflow -tA "$@"; }

          docker compose up -d postgres api
          esperar_api

          echo "== La base de datos se inicializó con el esquema y con la base de n8n"
          [ "$(psql_tf -c "select count(*) from information_schema.tables where table_name in ('tasks','event_outbox','users')")" = 3 ]
          docker compose exec -T postgres psql -U taskflow -tA -c "select datname from pg_database where datname='n8n'" | grep -qx n8n

          echo "== Seguridad de la API en producción"
          [ "$(codigo /health/ready)" = 200 ]
          [ "$(codigo /api/tasks)" = 401 ]
          [ "$(codigo /api/tasks "X-API-Key=${CLAVE}")" = 200 ]
          [ "$(codigo /docs)" = 404 ]

          echo "== Copia de seguridad y restauración"
          psql_tf -c "insert into tasks (title) values ('sobrevive a la restauración')" > /dev/null
          BACKUP_DIR="$PWD/backups" ./backup.sh
          ls backups/taskflow-*.sql.gz backups/n8n-*.sql.gz
          psql_tf -c "delete from tasks" > /dev/null
          echo taskflow | BACKUP_DIR="$PWD/backups" ./restore.sh taskflow "$(ls backups/taskflow-*.sql.gz | head -1)"
          [ "$(psql_tf -c "select title from tasks")" = "sobrevive a la restauración" ]
          esperar_api
          [ "$(codigo /health/ready)" = 200 ]
      - name: Registros si algo falló
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail=80 api postgres
      - name: Limpiar
        if: always()
        working-directory: deploy
        run: docker compose down -v

  web:
    name: Empaquetado de la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/build_web.py
      - name: Comprobar la sintaxis del JavaScript generado
        run: node --check taskflow-web/dist/assets/app.*.js
      - name: Pruebas de la lógica de la interfaz (sesión, API y estado)
        run: node --test taskflow-web/tests/*.test.mjs

  sql:
    name: Sintaxis de los scripts SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pglast
      - run: |
          python - <<'PY'
          import glob, pglast
          archivos = glob.glob("backend/db/**/*.sql", recursive=True)
          for ruta in archivos:
              pglast.parse_sql(open(ruta, encoding="utf-8").read())
              print("OK", ruta)
          assert archivos, "No se encontraron scripts SQL"
          PY
